<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0f">
  <title>{% block title %}Sasso Radar Tower{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="top-nav">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">SRT</a>
      <div class="links">
        <a href="{{ url_for('radar') }}" {% if request.endpoint == 'radar' %}class="active"{% endif %}>Radar</a>
        <a href="{{ url_for('display') }}" {% if request.endpoint == 'display' %}class="active"{% endif %}>Darstellung</a>
        <a href="{{ url_for('weather') }}" {% if request.endpoint == 'weather' %}class="active"{% endif %}>Wetter</a>
        <a href="{{ url_for('api_keys') }}" {% if request.endpoint == 'api_keys' %}class="active"{% endif %}>API-Schlüssel</a>
        <a href="{{ url_for('system') }}" {% if request.endpoint == 'system' %}class="active"{% endif %}>System</a>
        <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}class="active"{% endif %}>Über</a>
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>
    Sasso Radar Tower v{{ version | default('?') }} &mdash;
    Daten: <a href="https://adsb.fi" target="_blank">adsb.fi</a>
  </footer>

  <script>
    document.querySelectorAll('[data-autofade]').forEach(function (el) {
      setTimeout(function () { el.style.opacity = '0'; }, 2500);
    });
  </script>
</body>
</html>
