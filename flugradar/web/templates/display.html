{% extends "base.html" %}
{% block title %}Darstellung - SRT{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Darstellung</h1>
  <p class="context">Theme, Icons, Helligkeit, Einheiten</p>
</header>

{% if request.args.get('saved') %}
<p class="save-confirm" data-autofade>Gespeichert</p>
{% endif %}

<form method="post">
  <section class="section">
    <h2>Theme</h2>
    <div class="form-group">
      <label for="theme">Farbschema</label>
      <select id="theme" name="theme">
        <option value="amber" {% if settings.theme | default('amber') == 'amber' %}selected{% endif %}>Amber</option>
        <option value="mono" {% if settings.theme == 'mono' %}selected{% endif %}>Mono</option>
      </select>
    </div>
  </section>

  <section class="section">
    <h2>Flugzeug-Icons</h2>
    <div class="form-group">
      <label for="aircraft_icon_set">Icon-Set</label>
      <select id="aircraft_icon_set" name="aircraft_icon_set">
        <option value="detailed" {% if settings.aircraft_icon_set | default('detailed') == 'detailed' %}selected{% endif %}>Detailliert (typspezifische SVG-Icons)</option>
        <option value="simple" {% if settings.aircraft_icon_set == 'simple' %}selected{% endif %}>Einfach (handgezeichnete Formen)</option>
      </select>
    </div>
  </section>

  <section class="section">
    <h2>Ruheverhalten</h2>
    <div class="form-group">
      <label for="auto_clock_s">Automatisch zur Uhr (Sekunden, 0 = aus)</label>
      <input type="number" id="auto_clock_s" name="auto_clock_s"
             value="{{ settings.auto_clock_s }}" min="0" step="30">
    </div>
  </section>

  <section class="section">
    <h2>Radar-Elemente</h2>
    <div class="form-group">
      <label for="show_compass">
        <input type="checkbox" id="show_compass" name="show_compass"
               value="1" {% if settings.show_compass %}checked{% endif %}>
        Kompassrose
      </label>
    </div>
    <div class="form-group">
      <label for="show_sweep">
        <input type="checkbox" id="show_sweep" name="show_sweep"
               value="1" {% if settings.show_sweep %}checked{% endif %}>
        Sweep-Animation
      </label>
    </div>
    <div class="form-group">
      <label for="show_aircraft_tags">
        <input type="checkbox" id="show_aircraft_tags" name="show_aircraft_tags"
               value="1" {% if settings.show_aircraft_tags %}checked{% endif %}>
        Flugzeug-Beschriftung (Rufzeichen/Typ/Höhe)
      </label>
    </div>
  </section>

  <section class="section">
    <h2>Anzeige</h2>
    <div class="form-group">
      <label for="brightness">Helligkeit (%)</label>
      <input type="range" id="brightness" name="brightness" min="10" max="100" step="5"
             value="{{ settings.brightness }}">
    </div>
    <div class="form-group">
      <label for="night_mode_enabled">
        <input type="checkbox" id="night_mode_enabled" name="night_mode_enabled"
               value="1" {% if settings.night_mode_enabled %}checked{% endif %}>
        Nachtmodus
      </label>
    </div>
    <div class="form-row-3">
      <div class="form-group">
        <label for="night_mode_start">Von</label>
        <input type="time" id="night_mode_start" name="night_mode_start"
               value="{{ settings.night_mode_start }}">
      </div>
      <div class="form-group">
        <label for="night_mode_end">Bis</label>
        <input type="time" id="night_mode_end" name="night_mode_end"
               value="{{ settings.night_mode_end }}">
      </div>
      <div class="form-group">
        <label for="night_mode_brightness">Nachthelligkeit (%)</label>
        <input type="number" id="night_mode_brightness" name="night_mode_brightness"
               min="5" max="100" step="5" value="{{ settings.night_mode_brightness }}">
      </div>
    </div>
  </section>

  <section class="section">
    <h2>Einheiten</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="temperature_unit">Temperatur</label>
        <select id="temperature_unit" name="temperature_unit">
          <option value="c" {% if settings.temperature_unit | default('c') == 'c' %}selected{% endif %}>°C</option>
          <option value="f" {% if settings.temperature_unit == 'f' %}selected{% endif %}>°F</option>
        </select>
      </div>
      <div class="form-group">
        <label for="time_format">Uhrzeit</label>
        <select id="time_format" name="time_format">
          <option value="24h" {% if settings.time_format | default('24h') == '24h' %}selected{% endif %}>24 h</option>
          <option value="12h" {% if settings.time_format == '12h' %}selected{% endif %}>12 h</option>
        </select>
      </div>
    </div>
  </section>

  <div class="btn-group">
    <button type="submit" class="btn">Speichern</button>
  </div>
</form>
{% endblock %}
