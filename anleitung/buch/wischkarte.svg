<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" font-family="Inter, sans-serif">
  <!--
    Die Wischkarte -- von Hand gezeichnet aus der tatsächlichen
    Übergangstabelle in flugradar/display/app.py:653-785 (siehe
    anleitung/README.md). Kein generiertes Diagramm: jeder Pfeil hier
    entspricht einem konkreten "elif gesture.type == ..." Zweig im Code.

    Farben fest verdrahtet (kein CSS-Bezug), damit die Datei auch
    eigenständig -- außerhalb des Buch-HTML -- korrekt aussieht:
      Radar (Nabe)       #D2B446 (Akzent, invertiertes theme.py-Amber)
      Hinweg (vom Radar)  #B08A1E (dunkleres Akzentgold)
      Rückweg (zum Radar) #8A877D (gedämpftes Grau)
      Tippen (Tap)        #B08A1E, gepunktet
      Automatisch/Menü    #8A877D, gestrichelt
      Knotentext          #1A1C1D
  -->
  <defs>
    <marker id="pfeilHin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B08A1E"/>
    </marker>
    <marker id="pfeilRueck" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A877D"/>
    </marker>
  </defs>

  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#1A1C1D">Die Wischkarte</text>
  <text x="320" y="58" text-anchor="middle" font-size="10.5" fill="#6B6860">Jeder Screen ist von hier aus in höchstens zwei Schritten erreichbar</text>

  <!-- ===== Verbindungslinien (unter den Knoten gezeichnet) ===== -->

  <!-- Radar <-> Info -->
  <line x1="308" y1="418" x2="308" y2="151" stroke="#B08A1E" stroke-width="1.6" marker-end="url(#pfeilHin)"/>
  <text x="298" y="286" text-anchor="end" font-size="9" letter-spacing="0.5" fill="#B08A1E">WISCHEN HOCH</text>
  <line x1="332" y1="151" x2="332" y2="418" stroke="#8A877D" stroke-width="1.3" marker-end="url(#pfeilRueck)"/>
  <text x="342" y="286" text-anchor="start" font-size="9" letter-spacing="0.5" fill="#8A877D">WISCHEN RUNTER · RECHTS</text>

  <!-- Radar <-> Uhr -->
  <line x1="308" y1="482" x2="308" y2="733" stroke="#B08A1E" stroke-width="1.6" marker-end="url(#pfeilHin)"/>
  <text x="298" y="611" text-anchor="end" font-size="9" letter-spacing="0.5" fill="#B08A1E">WISCHEN RUNTER</text>
  <line x1="332" y1="733" x2="332" y2="482" stroke="#8A877D" stroke-width="1.3" marker-end="url(#pfeilRueck)"/>
  <text x="342" y="611" text-anchor="start" font-size="9" letter-spacing="0.5" fill="#8A877D">WISCHEN HOCH</text>

  <!-- Radar <-> Einstellungen -->
  <line x1="235" y1="440" x2="165" y2="440" stroke="#B08A1E" stroke-width="1.6" marker-end="url(#pfeilHin)"/>
  <text x="200" y="428" text-anchor="middle" font-size="7.2" letter-spacing="0.3" fill="#B08A1E">WISCHEN LINKS</text>
  <line x1="165" y1="464" x2="235" y2="464" stroke="#8A877D" stroke-width="1.3" marker-end="url(#pfeilRueck)"/>
  <text x="200" y="483" text-anchor="middle" font-size="7.2" letter-spacing="0.3" fill="#8A877D">WISCHEN RECHTS</text>

  <!-- Radar <-> Verfolgter Flug -->
  <line x1="405" y1="440" x2="475" y2="440" stroke="#B08A1E" stroke-width="1.6" marker-end="url(#pfeilHin)"/>
  <text x="440" y="428" text-anchor="middle" font-size="7.2" letter-spacing="0.3" fill="#B08A1E">WISCHEN RECHTS</text>
  <line x1="475" y1="464" x2="405" y2="464" stroke="#8A877D" stroke-width="1.3" marker-end="url(#pfeilRueck)"/>
  <text x="440" y="483" text-anchor="middle" font-size="7.2" letter-spacing="0.3" fill="#8A877D">RECHTS · RUNTER</text>

  <!-- Uhr <-> Wetter -->
  <line x1="385" y1="750" x2="475" y2="750" stroke="#B08A1E" stroke-width="1.6" marker-end="url(#pfeilHin)"/>
  <text x="430" y="740" text-anchor="middle" font-size="9" letter-spacing="0.5" fill="#B08A1E">WISCHEN RECHTS</text>
  <line x1="475" y1="774" x2="385" y2="774" stroke="#8A877D" stroke-width="1.3" marker-end="url(#pfeilRueck)"/>
  <text x="430" y="793" text-anchor="middle" font-size="9" letter-spacing="0.5" fill="#8A877D">WISCHEN LINKS · RUNTER</text>

  <!-- Radar -> Flugdetail (Tippen), Flugdetail -> Radar (Wischen) -->
  <line x1="402" y1="422" x2="478" y2="252" stroke="#B08A1E" stroke-width="1.4" stroke-dasharray="1,4" stroke-linecap="round" marker-end="url(#pfeilHin)"/>
  <line x1="478" y1="268" x2="405" y2="415" stroke="#8A877D" stroke-width="1.3" marker-end="url(#pfeilRueck)"/>
  <text x="470" y="355" text-anchor="start" font-size="7.4" letter-spacing="0.3" fill="#B08A1E">TIPPEN AUF</text>
  <text x="470" y="366" text-anchor="start" font-size="7.4" letter-spacing="0.3" fill="#B08A1E">FLUGZEUG</text>
  <text x="470" y="382" text-anchor="start" font-size="7.4" letter-spacing="0.3" fill="#8A877D">WISCHEN RECHTS</text>
  <text x="470" y="393" text-anchor="start" font-size="7.4" letter-spacing="0.3" fill="#8A877D">· RUNTER</text>

  <!-- Flugdetail -> Verfolgter Flug (Tippen "Folgen") -->
  <line x1="540" y1="277" x2="540" y2="420" stroke="#B08A1E" stroke-width="1.4" stroke-dasharray="1,4" stroke-linecap="round" marker-end="url(#pfeilHin)"/>
  <text x="602" y="352" text-anchor="middle" font-size="8.6" letter-spacing="0.4" fill="#B08A1E">„FOLGEN"</text>
  <text x="602" y="364" text-anchor="middle" font-size="8.6" letter-spacing="0.4" fill="#B08A1E">TIPPEN</text>

  <!-- Einstellungen -> WLAN (Menü-Aktion, kein Wisch-Ziel) -->
  <line x1="100" y1="477" x2="100" y2="733" stroke="#8A877D" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#pfeilRueck)"/>
  <text x="108" y="608" text-anchor="start" font-size="8.6" letter-spacing="0.4" fill="#6B6860">SYSTEM →</text>
  <text x="108" y="620" text-anchor="start" font-size="8.6" letter-spacing="0.4" fill="#6B6860">WLAN EINRICHTEN</text>

  <!-- ===== Knoten ===== -->

  <!-- Radar (Nabe) -->
  <rect x="235" y="418" width="170" height="64" rx="6" fill="#FBEFCB" stroke="#B08A1E" stroke-width="2"/>
  <text x="320" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1C1D">RADAR</text>
  <text x="320" y="461" text-anchor="middle" font-size="8.5" fill="#6B6860">Start / Zuhause</text>

  <!-- Info -->
  <rect x="255" y="93" width="130" height="54" rx="6" fill="none" stroke="#1A1C1D" stroke-width="1.3"/>
  <text x="320" y="115" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">INFO</text>
  <text x="320" y="131" text-anchor="middle" font-size="8" fill="#6B6860">Version, Netzwerk</text>

  <!-- Uhr -->
  <rect x="255" y="733" width="130" height="54" rx="6" fill="none" stroke="#1A1C1D" stroke-width="1.3"/>
  <text x="320" y="755" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">UHR</text>
  <text x="320" y="771" text-anchor="middle" font-size="8" fill="#6B6860">Uhrzeit, Wetter kurz</text>

  <!-- Einstellungen -->
  <rect x="35" y="423" width="130" height="54" rx="6" fill="none" stroke="#1A1C1D" stroke-width="1.3"/>
  <text x="100" y="445" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">EINSTELL-</text>
  <text x="100" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">UNGEN</text>
  <text x="100" y="471" text-anchor="middle" font-size="8" fill="#6B6860">zwei Ebenen</text>

  <!-- Verfolgter Flug -->
  <rect x="475" y="423" width="130" height="54" rx="6" fill="none" stroke="#1A1C1D" stroke-width="1.3"/>
  <text x="540" y="445" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">VERFOLGTER</text>
  <text x="540" y="458" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">FLUG</text>
  <text x="540" y="471" text-anchor="middle" font-size="8" fill="#6B6860">falls ausgewählt</text>

  <!-- Flugdetail -->
  <rect x="475" y="223" width="130" height="54" rx="6" fill="none" stroke="#1A1C1D" stroke-width="1.3"/>
  <text x="540" y="245" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">FLUGDETAIL</text>
  <text x="540" y="261" text-anchor="middle" font-size="8" fill="#6B6860">Route, Höhe, Foto</text>

  <!-- Wetter -->
  <rect x="475" y="733" width="130" height="54" rx="6" fill="none" stroke="#1A1C1D" stroke-width="1.3"/>
  <text x="540" y="755" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A1C1D">WETTER</text>
  <text x="540" y="771" text-anchor="middle" font-size="8" fill="#6B6860">5-Tage-Vorschau</text>

  <!-- WLAN -->
  <rect x="35" y="733" width="130" height="54" rx="6" fill="none" stroke="#8A877D" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="100" y="755" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4A473F">WLAN</text>
  <text x="100" y="771" text-anchor="middle" font-size="7.6" fill="#6B6860">auch automatisch</text>

  <!-- ===== Legende ===== -->
  <g transform="translate(60,845)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#B08A1E" stroke-width="1.6" marker-end="url(#pfeilHin)"/>
    <text x="42" y="3.5" font-size="9" fill="#4A473F">Wischen (vom Radar aus)</text>

    <line x1="230" y1="0" x2="264" y2="0" stroke="#B08A1E" stroke-width="1.4" stroke-dasharray="1,4" stroke-linecap="round" marker-end="url(#pfeilHin)"/>
    <text x="272" y="3.5" font-size="9" fill="#4A473F">Tippen</text>

    <line x1="380" y1="0" x2="414" y2="0" stroke="#8A877D" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#pfeilRueck)"/>
    <text x="422" y="3.5" font-size="9" fill="#4A473F">Automatisch / Menü</text>
  </g>
</svg>
